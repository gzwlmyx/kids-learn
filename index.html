<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4A78F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>快乐学习小闯关 · 语文+数学+英语</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --blue:#4A78F5; --blue-d:#3560D8; --green:#2FBF85; --green-d:#249E6D;
  --orange:#F28A2E; --orange-d:#D9761C; --red:#E85A5A; --yellow:#F5C928;
  --purple:#8F6CF5; --pink:#F0628F; --sky:#2FA9E0;
  --ink:#1E2233; --ink2:#434A63; --card:#FFFDF9; --line:#D3DBEE;
  --safe-top:max(env(safe-area-inset-top, 0px), 26px);
  --safe-bottom:max(env(safe-area-inset-bottom, 0px), 18px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'HarmonyOS Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,#E4EEFF 0%,#EEE5FF 52%,#FFF3E4 100%);
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;-webkit-font-smoothing:antialiased;
}
#app{position:relative;height:100vh;height:100dvh;overflow:hidden;}

/* 背景装饰 */
.bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.bg span{position:absolute;font-size:42px;opacity:.5;animation:floaty 7s ease-in-out infinite;}
.bg span:nth-child(1){left:4%;top:12%;}
.bg span:nth-child(2){right:6%;top:8%;animation-delay:1.2s;}
.bg span:nth-child(3){left:9%;bottom:14%;animation-delay:2.1s;font-size:34px;}
.bg span:nth-child(4){right:10%;bottom:10%;animation-delay:.7s;font-size:38px;}
.bg span:nth-child(5){left:46%;top:4%;animation-delay:1.8s;font-size:28px;}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-16px) rotate(3deg);}}

/* 顶部状态栏 */
.hud{
  position:absolute;top:0;left:0;right:0;z-index:6;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 4px) 20px 6px;
  font-weight:800;font-size:clamp(16px,2vw,22px);color:var(--ink2);pointer-events:none;
}
.hud .hud-left,.hud .hud-right{display:flex;align-items:center;gap:14px;pointer-events:auto;}
.hud .stars-badge{background:#FFF7DA;border:2px solid #FFE28A;border-radius:999px;padding:4px 14px;color:#B07D00;font-weight:900;}
.hud .level-badge{background:rgba(255,255,255,.75);border-radius:999px;padding:4px 14px;font-weight:800;}
.hud button{background:none;border:none;font-size:24px;cursor:pointer;padding:6px;line-height:1;pointer-events:auto;}

/* 屏幕容器 */
.screen{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--safe-top) + 50px) 20px calc(var(--safe-bottom) + 14px);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .28s ease,transform .28s ease,visibility .28s;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.screen.active{opacity:1;visibility:visible;transform:translateY(0);}
.content{width:min(1120px,96vw);flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0;}

/* 首页 */
#screen-home .content{gap:20px;text-align:center;align-items:center;}
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;}
.logo{font-size:clamp(62px,13vw,104px);line-height:1;filter:drop-shadow(0 10px 0 rgba(79,124,255,.18));animation:bounce 2.2s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
h1.title{
  font-size:clamp(32px,6.4vw,58px);font-weight:900;letter-spacing:2px;
  background:linear-gradient(120deg,#3A63E0,#7C5CFF 45%,#FF7A45 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{font-size:clamp(14px,2.4vw,19px);color:var(--ink2);font-weight:700;letter-spacing:.5px;}
.home-card{
  background:rgba(255,253,249,.94);border-radius:32px;padding:clamp(16px,3vw,26px);
  display:flex;flex-direction:column;gap:14px;align-items:center;
  box-shadow:0 16px 36px rgba(80,100,180,.16);width:min(600px,92vw);
}
.home-info{font-size:clamp(14px,2.3vw,18px);color:var(--ink2);font-weight:700;line-height:1.6;}
.home-info b{color:#B07D00;}
.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:900;
  border-radius:20px;padding:16px 30px;font-size:clamp(19px,3.6vw,26px);
  color:#fff;letter-spacing:1px;transition:transform .12s ease,box-shadow .12s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:linear-gradient(180deg,#6D96FF,#3A63E0);box-shadow:0 8px 0 #2A4FC2,0 14px 26px rgba(60,90,200,.35);}
.btn.primary:active{box-shadow:0 4px 0 #2A4FC2;}
.btn.green{background:linear-gradient(180deg,#5FE0AC,#2FB77A);box-shadow:0 8px 0 #22915F,0 14px 26px rgba(47,183,122,.3);}
.btn.orange{background:linear-gradient(180deg,#FFB067,#F0821F);box-shadow:0 8px 0 #C96A14,0 14px 26px rgba(240,130,31,.3);}
.btn.ghost{background:#fff;color:var(--blue);border:3px solid #D7E2FF;box-shadow:0 5px 0 #D7E2FF;font-size:clamp(16px,2.8vw,21px);padding:13px 24px;border-radius:18px;}
.btn.ghost:active{box-shadow:0 2px 0 #D7E2FF;}
.btn.wide{width:min(420px,86vw);}
.reset-link{background:none;border:none;color:#9AA3C0;font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px;font-family:inherit;}

/* 答题 */
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.pill{border-radius:999px;padding:6px 16px;font-weight:900;font-size:clamp(14px,2.2vw,18px);}
.pill-math{background:#E8EEFF;color:#3A63E0;}
.pill-cn{background:#FFEDE0;color:#E26A00;}
.pill-en{background:#E3FBEF;color:#17764B;}
.qmeta{display:flex;align-items:center;gap:10px;font-size:clamp(13px,2vw,16px);color:var(--ink2);font-weight:800;}
.diff{background:rgba(255,255,255,.75);border-radius:999px;padding:4px 12px;color:#8A93B0;font-size:clamp(11px,1.8vw,14px);}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.dots .dot{width:10px;height:10px;border-radius:50%;background:#D7DEF2;}
.dots .dot.done{background:var(--green);}
.dots .dot.cur{background:var(--blue);transform:scale(1.3);}
.q-card{
  background:rgba(255,255,255,.92);border-radius:30px;
  padding:clamp(16px,3.2vw,28px);box-shadow:0 18px 40px rgba(90,110,200,.16);
  display:flex;flex-direction:column;gap:clamp(12px,2.2vw,20px);width:100%;
}
.q-line{display:flex;align-items:center;gap:12px;}
.q-text{font-size:clamp(23px,4.8vw,40px);font-weight:900;line-height:1.3;flex:1;word-break:break-word;}
.read-btn{background:#EEF3FF;border:none;border-radius:16px;font-size:clamp(20px,3.6vw,26px);padding:8px 12px;cursor:pointer;flex:none;}
.read-btn:active{transform:scale(.94);}
.q-col{flex:1;display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-width:0;}
.q-col .q-text{flex:none;}
.listen-btn{margin:2px 0 0;background:linear-gradient(180deg,#FFD06B,#F5A623);color:#5A3B00;box-shadow:0 6px 0 #C97F0E;border-radius:18px;padding:12px 28px;font-size:clamp(17px,2.6vw,24px);}
.listen-btn:active{box-shadow:0 3px 0 #C97F0E;transform:scale(.97);}
.options{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,16px);}
.opt{
  border:3px solid var(--line);background:#fff;border-radius:20px;
  font-family:inherit;font-weight:900;font-size:clamp(18px,3.2vw,28px);
  color:var(--ink);padding:clamp(13px,2.4vw,20px) 10px;cursor:pointer;
  transition:transform .12s,border-color .15s,background .15s,box-shadow .15s;
  box-shadow:0 5px 0 var(--line);min-height:62px;
}
.opt:active{transform:scale(.97);}
.opt.correct{background:#E3FBEF;border-color:var(--green);box-shadow:0 5px 0 var(--green);color:#17764B;animation:pulse .5s ease;}
.opt.wrong{background:#FFECEC;border-color:var(--red);box-shadow:0 5px 0 var(--red);color:#B02A2A;}
.opt:disabled{cursor:default;opacity:1;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.06);}100%{transform:scale(1);}}
.tip{
  display:none;background:#FFF7DA;border:2px solid #FFE28A;border-radius:18px;
  padding:12px 18px;font-size:clamp(14px,2.4vw,19px);font-weight:800;color:#8A6500;line-height:1.55;
}
.tip.show{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.next-row{display:flex;justify-content:center;}
.next-row .btn{min-width:min(340px,82vw);}
.hidden{display:none !important;}

/* 小游戏 */
#screen-game{padding-top:calc(env(safe-area-inset-top,0px) + 58px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);}
#screen-game .content{gap:10px;justify-content:flex-start;}
.game-top{
  background:rgba(255,255,255,.9);border-radius:22px;padding:10px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  box-shadow:0 8px 22px rgba(90,110,200,.12);
}
.game-top .label{font-size:clamp(12px,2vw,15px);font-weight:800;color:var(--ink2);}
.game-top .score{font-size:clamp(18px,3vw,24px);font-weight:900;color:#E26A00;}
.hearts{font-size:clamp(19px,3.2vw,27px);letter-spacing:2px;line-height:1;}
.timerbar{height:12px;border-radius:8px;background:#E4E9F7;overflow:hidden;width:100%;}
.timerbar i{display:block;height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,#3ECF8E,#FFD93D);transition:width .35s linear;}
.timerbar i.low{background:linear-gradient(90deg,#FFD93D,#FF6B6B);}
.target-card{
  background:linear-gradient(180deg,#FFFFFF,#F3F7FF);border-radius:24px;
  padding:12px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 10px 26px rgba(90,110,200,.14);width:100%;
}
.target-card .prompt{font-size:clamp(12px,2vw,16px);font-weight:800;color:var(--ink2);}
.target-card .target{font-size:clamp(26px,5.2vw,46px);font-weight:900;color:var(--blue);letter-spacing:1px;line-height:1.15;text-align:center;word-break:break-word;}
.target-card .target.long{font-size:clamp(18px,3.6vw,28px);letter-spacing:0;}
.bubble-area{
  position:relative;flex:1;min-height:0;width:100%;
  background:rgba(255,255,255,.5);border-radius:26px;overflow:hidden;
  border:3px solid rgba(255,255,255,.7);
}
.bubble{
  position:absolute;left:0;top:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;cursor:pointer;user-select:none;
  box-shadow:inset -6px -8px 0 rgba(0,0,0,.14),0 8px 16px rgba(70,90,180,.3);
  transition:transform .12s ease,opacity .2s ease;will-change:top,left;
  padding:4px;text-align:center;line-height:1.05;
}
.bubble:active{transform:scale(.94);}
.bubble.pop{animation:bubblePop .26s ease forwards;}
@keyframes bubblePop{0%{transform:scale(1);opacity:1;}60%{transform:scale(1.5);opacity:.85;}100%{transform:scale(1.9);opacity:0;}}
.bubble.shake{animation:bubbleShake .4s ease;}
@keyframes bubbleShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px) rotate(-6deg);}40%{transform:translateX(8px) rotate(6deg);}60%{transform:translateX(-6px) rotate(-4deg);}80%{transform:translateX(6px) rotate(4deg);}}
.bubble.fade{opacity:0;transform:scale(.7);}
.float-star{position:absolute;font-size:24px;font-weight:900;color:#E2A100;pointer-events:none;animation:floatUp .7s ease forwards;z-index:9;}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(1);}to{opacity:0;transform:translateY(-70px) scale(1.5);}}
.quit-btn{position:absolute;right:74px;top:calc(var(--safe-top) + 2px);z-index:7;background:rgba(255,255,255,.92);border:none;border-radius:50%;width:44px;height:44px;font-size:19px;font-weight:900;color:#7C85A3;cursor:pointer;box-shadow:0 4px 10px rgba(90,110,200,.18);}

/* 结果 */
#screen-result .content{align-items:center;text-align:center;gap:14px;}
.result-emoji{font-size:clamp(66px,13vw,110px);line-height:1;animation:popIn .5s cubic-bezier(.2,1.6,.4,1);}
@keyframes popIn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.result-title{font-size:clamp(26px,4.8vw,40px);font-weight:900;color:var(--blue);}
.result-stars{font-size:clamp(36px,8vw,64px);font-weight:900;color:#E2A100;letter-spacing:2px;animation:popIn .6s .1s backwards;}
.result-detail{font-size:clamp(15px,2.6vw,20px);font-weight:800;color:var(--ink2);line-height:1.7;}
.result-detail b{color:#E26A00;}
.result-review{font-size:clamp(13px,2.2vw,17px);font-weight:700;color:#8A93B0;background:rgba(255,255,255,.7);padding:10px 18px;border-radius:999px;max-width:90vw;}
.result-buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px;}

/* 彩带 & 提示 */
.confetti{position:fixed;top:-24px;width:11px;height:17px;border-radius:3px;z-index:50;pointer-events:none;animation:confettiFall linear forwards;}
@keyframes confettiFall{to{transform:translateY(112vh) rotate(760deg);}}
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translateX(-50%) translateY(20px);
  background:rgba(43,47,66,.92);color:#fff;font-weight:800;font-size:15px;
  padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:60;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 响应式 */
@media (max-width:560px){
  .options{grid-template-columns:1fr;}
  .q-card{padding:14px;}
  .btn.wide{width:92vw;}
}
@media (orientation:landscape) and (max-height:560px){
  .screen{padding-top:calc(env(safe-area-inset-top,0px) + 46px);padding-bottom:8px;}
  .logo{display:none;}
  #screen-home .content{gap:10px;}
  .home-card{padding:12px;gap:10px;}
  .q-card{padding:12px 16px;gap:10px;}
  .q-text{font-size:clamp(19px,3.2vw,28px);}
  .opt{min-height:52px;padding:10px;}
  .target-card .target{font-size:clamp(20px,3.4vw,32px);}
}

/* ===== 华为 MatePad 11.5 等 3:2 平板优化（11.5 英寸 2.2K/2.8K 柔光屏） ===== */
@media (min-width: 900px){
  .content{width:min(1120px,94vw);gap:18px;}
  .quit-btn{width:48px;height:48px;font-size:21px;right:84px;}
  .hud{padding-left:26px;padding-right:26px;font-size:clamp(18px,1.8vw,22px);}
  .hud .stars-badge,.hud .level-badge{padding:6px 18px;}
  .hud button{font-size:28px;}
  .q-card{padding:26px 32px;gap:clamp(14px,1.6vw,22px);}
  .q-text{font-size:clamp(34px,4.4vw,52px);}
  .opt{font-size:clamp(24px,2.8vw,34px);min-height:80px;padding:20px 14px;}
  .pill{font-size:clamp(16px,1.8vw,21px);padding:8px 20px;}
  .qmeta{font-size:clamp(15px,1.6vw,19px);gap:14px;}
  .diff{font-size:clamp(13px,1.3vw,16px);padding:5px 14px;}
  .dots{gap:8px;}
  .dots .dot{width:12px;height:12px;}
  .tip{font-size:clamp(17px,1.8vw,22px);padding:14px 22px;}
  .btn{padding:18px 34px;font-size:clamp(21px,2.4vw,28px);}
  .btn.ghost{font-size:clamp(17px,2vw,22px);padding:15px 26px;}
  .btn.wide{width:min(460px,70vw);}
  .hero{gap:14px;}
  h1.title{font-size:clamp(44px,5.4vw,72px);}
  .subtitle{font-size:clamp(16px,1.8vw,22px);}
  .home-card{width:min(680px,80vw);padding:28px 32px;gap:20px;}
  .home-info{font-size:clamp(16px,1.9vw,21px);}
  .result-emoji{font-size:clamp(80px,9vw,120px);}
  .result-title{font-size:clamp(32px,4vw,46px);}
  .result-detail{font-size:clamp(18px,2vw,24px);}
  .result-review{font-size:clamp(15px,1.7vw,19px);}
  .result-buttons .btn{padding:16px 28px;}
  .target-card{padding:16px 26px;border-radius:26px;}
  .target-card .prompt{font-size:clamp(14px,1.5vw,18px);}
  .target-card .target{font-size:clamp(30px,3.8vw,54px);}
  .target-card .target.long{font-size:clamp(22px,2.8vw,34px);}
  .game-top{padding:14px 24px;}
  .game-top .label{font-size:clamp(13px,1.4vw,16px);}
  .game-top .score{font-size:clamp(22px,2.4vw,30px);}
  .hearts{font-size:clamp(22px,2.6vw,32px);}
}
@media (orientation: landscape) and (min-width: 900px){
  /* 横屏：首页左右分栏，答题左题目右选项，充分利用 3:2 宽屏 */
  #screen-home .content{flex-direction:row;align-items:center;justify-content:center;gap:clamp(40px,5vw,96px);}
  .q-card{
    display:grid;
    grid-template-columns:1.12fr 1fr;
    grid-template-areas:"q opts" "tip tip" "next next";
    align-items:center;
    column-gap:clamp(20px,2.4vw,36px);
    row-gap:16px;
  }
  .q-line{grid-area:q;align-items:flex-start;}
  .options{grid-area:opts;align-content:center;}
  .tip{grid-area:tip;}
  .next-row{grid-area:next;}
}
@media (min-width: 1200px){
  .content{width:min(1240px,92vw);}
  .opt{min-height:88px;}
}
</style>
</head>
<body>
<div id="app">
  <div class="bg" aria-hidden="true"><span>☁️</span><span>⭐</span><span>🌈</span><span>🎈</span><span>✨</span></div>

  <header class="hud">
    <div class="hud-left">
      <span class="stars-badge">⭐ <span id="hudStars">0</span></span>
      <span class="level-badge" id="hudLevel">第 1 关</span>
    </div>
    <div class="hud-right">
      <button id="hudSound" aria-label="声音开关">🔊</button>
    </div>
  </header>

  <!-- 首页 -->
  <section class="screen active" id="screen-home">
    <div class="content">
      <div class="hero">
        <div class="logo" aria-hidden="true">🦉</div>
        <h1 class="title">快乐学习小闯关</h1>
        <p class="subtitle">语文 10 题 + 数学 10 题 + 英语 10 题 · 答错的多练几遍，慢慢变难</p>
      </div>
      <div class="home-card">
        <p class="home-info" id="homeInfo"></p>
        <button class="btn primary wide" id="btnStart">🚀 开始闯关</button>
        <button class="reset-link" id="btnReset">重新开始（清空星星和错题记录）</button>
      </div>
    </div>
  </section>

  <!-- 答题 -->
  <section class="screen" id="screen-quiz">
    <div class="content">
      <div class="quiz-top">
        <span class="pill pill-cn" id="quizSubject">📖 语文</span>
        <span class="qmeta"><span id="quizQNum">第 1 / 10 题</span><span class="diff" id="quizDiff">难度 ★☆☆</span></span>
      </div>
      <span class="dots" id="quizProgress"></span>
      <div class="q-card">
        <div class="q-line">
          <div class="q-col">
            <div class="q-text" id="quizQuestion">题目</div>
            <button class="btn listen-btn hidden" id="quizListen">🔊 点这里再听一遍</button>
          </div>
          <button class="read-btn" id="quizRead" aria-label="朗读题目">🔊</button>
        </div>

/* ---------------- 音效 ---------------- */
let actx = null;
function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') { actx.resume().catch(function () {}); }
}
function tone(freq, dur, type, vol, delay) {
  if (!state.soundOn || !actx) return;
  dur = dur || 0.12; type = type || 'sine'; vol = vol || 0.12; delay = delay || 0;
  try {
    const t0 = actx.currentTime + delay;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  correct() { tone(660, 0.1); tone(880, 0.14, 'sine', 0.12, 0.1); tone(1100, 0.16, 'sine', 0.1, 0.2); },
  wrong() { tone(200, 0.2, 'sawtooth', 0.09); tone(150, 0.22, 'sawtooth', 0.08, 0.12); },

function speakAs(text, lang, rate) {
  if (!state.soundOn || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = lang || 'zh-CN';
    u.rate = rate || 0.95;
    u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function speak(text) { speakAs(text, 'zh-CN', 0.95); }
function speakEn(text) { speakAs(text, 'en-US', 0.8); }

/* =========================================================
 *  自适应出题引擎
 *  - 每道题记录：出现次数 s / 答对次数 c / 答错次数 w
 *  - 权重：答错越多权重越高（下次更容易出现），答对越多权重越低
 *  - 难度：随着关卡和正确率变化，目标难度 1~3 慢慢提升
 * ========================================================= */
function questionsOf(subject) {
  return QUESTION_BANK.questions.filter((q) => q.subject === subject);
}
function subjectStats(subject) {
  let seen = 0, correct = 0;
  questionsOf(subject).forEach((q) => {
    const st = state.stats[q.id];
    if (st) { seen += st.s || 0; correct += st.c || 0; }
  });
  return { seen: seen, correct: correct, acc: seen ? correct / seen : 0.7 };
}
function subjectTarget(subject) {
  let target = 1 + Math.floor((state.level - 1) / 2);
  const st = subjectStats(subject);
  if (st.seen >= 6) {
    if (st.acc >= 0.85) target += 1;
    else if (st.acc < 0.5) target -= 1;
  }
  return clamp(target, 1, 3);
}
function weightOf(q) {
  const st = state.stats[q.id];
  if (!st) return 2.2; // 没做过的题优先出现
  return Math.max(0.25, 1 + 2 * (st.w || 0) - 0.6 * (st.c || 0));
}
function pickQuestion(subject) {
  const target = subjectTarget(subject);
  const pool = questionsOf(subject);
  const avoid = new Set(state.lastIds);
  let cand = pool.filter((q) => !avoid.has(q.id) && Math.abs(q.difficulty - target) <= 1);
  if (cand.length < 3) cand = pool.filter((q) => !avoid.has(q.id));
  if (cand.length === 0) cand = pool;
  const weights = cand.map((q) => {
    const dist = Math.abs(q.difficulty - target);
    const bonus = dist === 0 ? 1.9 : (dist === 1 ? 1.0 : 0.7);
    return weightOf(q) * bonus;
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < cand.length; i++) {
    r -= weights[i];
    if (r <= 0) return cand[i];
  }
  return cand[cand.length - 1];
}
function pickBlock(subject, count) {
  const res = [];
  let guard = 0;
  while (res.length < count && guard < 300) {
    guard++;
    const q = pickQuestion(subject);
    if (!res.some((x) => x.id === q.id)) res.push(q);
  }
  return res;
}

function startLevel(level) {
  ensureAudio();
  state.level = clamp(level, 1, 999);
  store.set('kkg2_level', state.level);
  state.block = 0;
  state.levelCorrect = 0;
  state.levelTotal = 0;
  state.levelEarned = 0;
  startBlock();
}
function startBlock() {
  const subj = SUBJECTS[state.block];
  state.questions = pickBlock(subj.key, QPS);
  state.blockQ = 0;
  state.blockCorrect = 0;
  state.blockEarned = 0;
  showScreen('quiz');
  renderQuestion();
}
function renderQuestion() {
  const q = state.questions[state.blockQ];
  const subj = SUBJECTS[state.block];
  state.answered = false;

  state.lastIds.push(q.id);
  if (state.lastIds.length > 5) state.lastIds.shift();

  $('#quizSubject').textContent = subj.emoji + ' ' + subj.name;
  $('#quizSubject').className = 'pill ' + subj.pill;
  $('#quizQNum').textContent = '第 ' + (state.blockQ + 1) + ' / ' + QPS + ' 题';
  $('#quizDiff').textContent = '难度 ' + '★'.repeat(q.difficulty) + '☆'.repeat(3 - q.difficulty);
  $('#quizProgress').innerHTML = '';
  for (let i = 0; i < QPS; i++) {
    const d = document.createElement('span');
    d.className = 'dot' + (i < state.blockQ ? ' done' : '') + (i === state.blockQ ? ' cur' : '');
    $('#quizProgress').appendChild(d);
  }
  $('#quizQuestion').textContent = q.question;

  const opts = $('#quizOptions');
  opts.innerHTML = '';
  shuffle(q.options).forEach((text) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.addEventListener('click', () => answerQuestion(b, text));
    opts.appendChild(b);
  });

  const tip = $('#quizTip');
  tip.classList.remove('show');
  tip.textContent = '';
  $('#quizNext').classList.add('hidden');

  const listenBtn = $('#quizListen');
  if (q.listen) {
    listenBtn.classList.remove('hidden');
    setTimeout(() => speakEn(q.listen), 420);
  } else {
    listenBtn.classList.add('hidden');
    setTimeout(() => speak('第' + (state.blockQ + 1) + '题。' + (q.read || q.question)), 380);
  }
}
function answerQuestion(btn, text) {
  if (state.answered) return;
  state.answered = true;
  const q = state.questions[state.blockQ];
  const ok = text === q.answer;
  const st = state.stats[q.id] || (state.stats[q.id] = { s: 0, c: 0, w: 0 });
  st.s++;
  if (ok) st.c++; else st.w++;
  store.set('kkg2_stats', state.stats);

  $$('#quizOptions .opt').forEach((b) => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
  });

  state.levelTotal++;
  if (ok) {
    sfx.correct();
    state.blockCorrect++;
    state.levelCorrect++;
    state.stars++;
    state.blockEarned++;
    state.levelEarned++;
    store.set('kkg2_stars', state.stars);
    updateHUD();
    speak('答对啦！' + q.explain);
  } else {
    btn.classList.add('wrong');
    sfx.wrong();
    speak('再想一想。' + q.explain);
  }

  const tip = $('#quizTip');
  tip.textContent = (ok ? '✅ 答对啦！' : '💡 正确答案是「' + q.answer + '」 ') + q.explain +
    (ok ? '' : ' 别急，这道题以后会多出现几次帮你记住～');
  tip.classList.add('show');

  const next = $('#quizNext');
  next.classList.remove('hidden');
  next.textContent = state.blockQ >= QPS - 1 ? '🎮 去玩小游戏' : '下一题 ➜';
  next.onclick = () => {
    if (state.blockQ >= QPS - 1) {
      startMiniGame();
    } else {
      state.blockQ++;
      renderQuestion();
    }
  };
}

/* =========================================================
 *  知识泡泡小游戏（每科 10 题后玩一次）
 *  题目来自该科题库（同样受自适应影响），点对答案得分
 * ========================================================= */
const HEARTS_MAX = 3;
const GAME_TIME = 30;
const BUBBLE_COLORS = ['#4F7CFF', '#FF9A3C', '#9B7BFF', '#3ECF8E', '#FF6B9D', '#38BDF8'];

function startMiniGame() {
  const subj = SUBJECTS[state.block];
  state.game = {
    type: subj.key, name: subj.name,
    score: 0, hearts: HEARTS_MAX, time: GAME_TIME,
    target: null, options: [], bubbles: [],
    rafId: null, tickId: null, spawnId: null,
    over: false, lastTs: 0
  };
  const g = state.game;
  $('#gameScore').textContent = '0';
  renderHearts();
  updateTimerBar();
  showScreen('game');
  nextTarget();
  g.lastTs = performance.now();
  g.tickId = setInterval(gameTick, 1000);
  g.rafId = requestAnimationFrame(moveLoop);
  g.spawnId = setInterval(spawnBubble, 950);
  setTimeout(spawnBubble, 250);
  setTimeout(spawnBubble, 600);
}
function stopMiniGame() {
  const g = state.game;
  if (!g) return;
  g.over = true;
  if (g.tickId) clearInterval(g.tickId);
  if (g.spawnId) clearInterval(g.spawnId);
  if (g.rafId) cancelAnimationFrame(g.rafId);
  g.bubbles.forEach((b) => { try { b.el.remove(); } catch (e) {} });
  state.game = null;
  try { speechSynthesis.cancel(); } catch (e) {}
  $('#bubbleArea').innerHTML = '';
}
function nextTarget() {
  const g = state.game;
  if (!g || g.over) return;
  let q = pickQuestion(g.type);
  let guard = 0;
  while (q.listen && guard < 12) { q = pickQuestion(g.type); guard++; }
  g.target = q;
  g.options = q.options.map(String);
  $('#gamePrompt').textContent = g.name + ' · 找出正确答案';
  const t = $('#gameTarget');
  t.textContent = q.question;
  t.classList.toggle('long', q.question.length > 9);
  speak(q.read || q.question);
}
function renderHearts() {
  const g = state.game;
  if (!g) return;
  const h = Math.max(0, g.hearts);
  $('#gameHearts').textContent = '❤️'.repeat(h) + '🤍'.repeat(HEARTS_MAX - h);
}
function updateTimerBar() {
  const g = state.game;
  if (!g) return;
  const fill = $('#timerFill');
  fill.style.width = Math.max(0, (g.time / GAME_TIME) * 100) + '%';
  fill.classList.toggle('low', g.time <= 8);
}
function gameTick() {
  const g = state.game;
  if (!g || g.over) return;
  g.time--;
  updateTimerBar();
  if (g.time <= 0) endMiniGame();
}
function bubbleFontSize(size, value) {
  const len = Math.max(1, String(value).length);
  const hasCjk = /[\u4e00-\u9fff]/.test(String(value));
  const maxByLen = hasCjk ? (size * 0.82 / len) : (size * 1.7 / len);
  return Math.max(12, Math.min(size * 0.33, maxByLen));
}
function spawnBubble() {
  const g = state.game;
  if (!g || g.over || state.screen !== 'game') return;
  const area = $('#bubbleArea');
  if (!area || area.clientWidth === 0) return;
  if (g.bubbles.length >= 7) return;
  const aw = area.clientWidth;
  const ah = area.clientHeight;
  const size = clamp(Math.round(aw * 0.16), 64, 140);
  /* 提高正确答案出现的概率，方便小朋友找到目标 */
  const value = Math.random() < 0.5 ? String(g.target.answer) : pick(g.options);
  const el = document.createElement('div');
  el.className = 'bubble';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.fontSize = Math.round(bubbleFontSize(size, value)) + 'px';
  el.style.background = BUBBLE_COLORS[randInt(0, BUBBLE_COLORS.length - 1)];
  el.textContent = value;
  const x = rand(10, Math.max(11, aw - size - 10));
  const b = { el: el, x: x, y: ah + size, vy: rand(60, 92) + g.score * 3, value: String(value), dead: false };
  el.style.left = b.x + 'px';
  el.style.top = b.y + 'px';
  el.addEventListener('pointerdown', (ev) => { ev.preventDefault(); tapBubble(b); });
  area.appendChild(el);
  g.bubbles.push(b);
}
function tapBubble(b) {
  const g = state.game;
  if (!g || g.over || b.dead) return;
  if (b.value === String(g.target.answer)) {
    b.dead = true;
    sfx.pop();
    b.el.classList.add('pop');
    setTimeout(() => { try { b.el.remove(); } catch (e) {} }, 280);
    g.score++;
    state.stars++;
    state.blockEarned++;
    state.levelEarned++;
    store.set('kkg2_stars', state.stars);
    $('#gameScore').textContent = g.score;
    updateHUD();
    floatStar(b.x + 18, b.y);
    if (g.type === 'math') speak((g.target.read || g.target.question) + ' 等于 ' + g.target.answer);
    else speak('真棒！');
    g.bubbles.forEach((o) => {
      if (o !== b && !o.dead) {
        o.dead = true;
        o.el.classList.add('fade');
        setTimeout(() => { try { o.el.remove(); } catch (e) {} }, 240);
      }
    });
    g.bubbles = [];
    setTimeout(() => { if (state.game === g && !g.over) nextTarget(); }, 160);
  } else {
    sfx.wrong();
    b.el.classList.add('shake');
    setTimeout(() => { try { b.el.classList.remove('shake'); } catch (e) {} }, 440);
    g.hearts--;
    renderHearts();
    if (g.hearts <= 0) endMiniGame();
  }
}
function floatStar(x, y) {
  const area = $('#bubbleArea');
  if (!area) return;
  const s = document.createElement('span');
  s.className = 'float-star';
  s.textContent = '+1 ⭐';
  s.style.left = x + 'px';
  s.style.top = y + 'px';
  area.appendChild(s);
  setTimeout(() => { try { s.remove(); } catch (e) {} }, 720);
}
function moveLoop(ts) {
  const g = state.game;
  if (!g || g.over || state.screen !== 'game') return;
  const dt = Math.min(Math.max((ts - g.lastTs) / 1000, 0), 0.1);
  g.lastTs = ts;
  for (let i = 0; i < g.bubbles.length; i++) {
    const b = g.bubbles[i];
    if (b.dead) continue;
    b.y -= b.vy * dt;
    if (b.y < -220) {
      b.dead = true;
      try { b.el.remove(); } catch (e) {}
      continue;
    }
    b.el.style.top = b.y + 'px';
  }
  g.bubbles = g.bubbles.filter((b) => !b.dead);
  g.rafId = requestAnimationFrame(moveLoop);
}
function endMiniGame() {
  const g = state.game;
  if (!g || g.over) return;
  g.over = true;
  if (g.tickId) clearInterval(g.tickId);
  if (g.spawnId) clearInterval(g.spawnId);
  if (g.rafId) cancelAnimationFrame(g.rafId);
  sfx.win();
  showBlockResult();
}

/* =========================================================
 *  结算
 * ========================================================= */
function showBlockResult() {
  const subj = SUBJECTS[state.block];
  const g = state.game;
  const isLast = state.block >= 2;
  if (isLast) {
    store.set('kkg2_level', state.level + 1);
    confetti();
  }
  showScreen('result');
  $('#resultEmoji').textContent = isLast ? '🎉' : subj.emoji;
  $('#resultTitle').textContent = isLast ? '第 ' + state.level + ' 关完成！' : subj.name + '完成！';
  $('#resultStars').textContent = '+' + state.blockEarned + ' ⭐';
  $('#resultDetail').innerHTML =
    subj.name + '答对 <b>' + state.blockCorrect + '</b> / ' + QPS + ' 题 · 小游戏得分 <b>' + (g ? g.score : 0) + '</b><br>' +
    (isLast
      ? '本关共答对 <b>' + state.levelCorrect + '</b> / ' + state.levelTotal + ' 题'
      : '累计星星：<b>' + state.stars + '</b> ⭐');
  $('#resultReview').textContent = '📚 知识回顾：' + (REVIEW[subj.key] || '');
  speak(isLast ? ('第' + state.level + '关完成！') : (subj.name + '完成！'));
  renderResultButtons(isLast);
}
function renderResultButtons(isLast) {
  const btns = $('#resultButtons');
  btns.innerHTML = '';
  if (!isLast) {
    addResultBtn(btns, '➡️ 继续' + SUBJECTS[state.block + 1].name, 'btn primary', () => {
      state.block++;
      startBlock();
    });
  } else {
    addResultBtn(btns, '➡️ 下一关', 'btn primary', () => startLevel(state.level + 1));
    addResultBtn(btns, '🔁 再玩一次', 'btn ghost', () => startLevel(state.level));
  }
  addResultBtn(btns, '🏠 回首页', 'btn ghost', goHome);
}
function addResultBtn(parent, text, cls, fn) {
  const b = document.createElement('button');
  b.className = cls;
  b.textContent = text;
  b.addEventListener('click', () => { ensureAudio(); fn(); });
  parent.appendChild(b);
}
function goHome() {
  if (state.game) stopMiniGame();
  state.level = clamp(store.get('kkg2_level', 1), 1, 999);
  renderHome();
  showScreen('home');
}

/* =========================================================
 *  彩带 & 提示
 * ========================================================= */
function confetti() {
  const colors = ['#FF6B6B', '#FFD93D', '#3ECF8E', '#4F7CFF', '#9B7BFF', '#FF9A3C'];
  for (let i = 0; i < 48; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = rand(0, 100) + 'vw';
    c.style.background = colors[randInt(0, colors.length - 1)];
    c.style.animationDuration = rand(2.2, 3.6) + 's';
    c.style.animationDelay = rand(0, 0.8) + 's';
    c.style.width = rand(7, 13) + 'px';
    c.style.height = rand(12, 20) + 'px';
    document.body.appendChild(c);
    setTimeout(() => { try { c.remove(); } catch (e) {} }, 4600);
  }
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* =========================================================
 *  事件绑定
 * ========================================================= */
$('#btnStart').addEventListener('click', () => { ensureAudio(); startLevel(state.level); });
$('#btnReset').addEventListener('click', () => {
  if (window.confirm('确定要重新开始吗？星星和错题记录都会被清空哦～')) {
    state.stars = 0;
    state.level = 1;
    state.stats = {};
    store.set('kkg2_stars', 0);
    store.set('kkg2_level', 1);
    store.set('kkg2_stats', {});
    renderHome();
    updateHUD();
    toast('已重新开始，加油！');
  }
});
$('#hudSound').addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  store.set('kkg2_sound', state.soundOn);
  updateHUD();
  if (state.soundOn) { ensureAudio(); sfx.pop(); }
  toast(state.soundOn ? '声音已开启' : '声音已关闭');
});
$('#quizRead').addEventListener('click', () => {
  ensureAudio();
  const q = state.questions[state.blockQ];
  if (!q) return;
  if (q.listen) speakEn(q.listen);
  else speak('第' + (state.blockQ + 1) + '题。' + (q.read || q.question));
});
$('#quizListen').addEventListener('click', () => {
  ensureAudio();
  const q = state.questions[state.blockQ];
  if (q && q.listen) speakEn(q.listen);
});
$('#btnQuit').addEventListener('click', () => {
  if (state.game) stopMiniGame();
  goHome();
  toast('已退出小游戏');
});
document.addEventListener('contextmenu', (e) => e.preventDefault());

/* =========================================================
 *  启动
 * ========================================================= */
renderHome();
updateHUD();
showScreen('home');

/* PWA：离线缓存 + 添加到桌面（通过 http/https 打开时生效；file:// 打开时自动跳过） */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

/* 调试/演示入口：?auto=quiz|game|result&level=N */
(function autoDemo() {
  try {
    const params = new URLSearchParams(location.search);
    const auto = params.get('auto');
    if (!auto) return;
    const lv = clamp(parseInt(params.get('level') || '1', 10) || 1, 1, 999);
    state.level = lv;
    if (auto === 'quiz') {
      startLevel(lv);
    } else if (auto === 'game') {
      ensureAudio();
      state.block = 0;
      startLevel(lv);
      startMiniGame();
    } else if (auto === 'result') {
      state.block = 2;
      state.levelCorrect = 26;
      state.levelTotal = 30;
      state.blockCorrect = 8;
      state.blockEarned = 6;
      showBlockResult();
    }
  } catch (e) {}
})();
</script>
